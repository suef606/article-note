<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기사 프로젝트 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16131f; --muted:#5d5870; --line:#e6e2ef;
    --bg:#faf9fc; --card:#ffffff;
    --a:#6c3cf0; --b:#ff5c8a; --c:#18b6a4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65}
  .page{max-width:760px;margin:0 auto;padding:40px 24px 56px}

  /* Hero */
  .hero{position:relative;overflow:hidden;border-radius:24px;padding:40px 36px;color:#fff;
    background:linear-gradient(135deg,var(--a) 0%,#9a4cf0 45%,var(--b) 100%)}
  .hero::after{content:"";position:absolute;right:-80px;top:-80px;width:260px;height:260px;border-radius:50%;
    background:rgba(255,255,255,.12)}
  .tag{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.08em;
    background:rgba(255,255,255,.18);padding:6px 12px;border-radius:999px;margin-bottom:16px}
  .hero h1{font-size:36px;font-weight:900;line-height:1.2;margin-bottom:12px;position:relative;z-index:1}
  .hero p{font-size:16px;opacity:.95;position:relative;z-index:1}
  .hero .label{font-size:12px;font-weight:700;letter-spacing:.06em;opacity:.8;display:block;margin-bottom:2px}

  /* Sections */
  section{margin-top:32px}
  h2{font-size:20px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:10px}
  h2::before{content:"";width:6px;height:20px;border-radius:3px;background:linear-gradient(var(--a),var(--b))}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
  .tbd{color:var(--muted);font-style:normal;background:#f1edfd;color:#4b2bb0;
    font-size:13px;font-weight:500;padding:3px 10px;border-radius:999px;white-space:nowrap}
  .tbd.pink{background:#ffe9f0;color:#b8204f}

  /* Rows */
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;flex-wrap:wrap}
  .row + .row{border-top:1px solid var(--line)}
  .row .k{font-size:13px;font-weight:700;color:var(--muted)}
  .row .v{font-weight:700;font-size:16px}

  /* Topic */
  .topic{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .topic .card b{display:block;font-size:12px;color:var(--a);letter-spacing:.06em;margin-bottom:6px}
  .topic .big{font-size:22px;font-weight:900}

  /* Checklist */
  .check{list-style:none}
  .check li{display:flex;align-items:center;gap:12px;padding:12px 0}
  .check li + li{border-top:1px solid var(--line)}
  .check input{width:20px;height:20px;accent-color:var(--a);flex-shrink:0}
  .check span{color:var(--muted);font-size:15px}

  /* Log */
  .log{list-style:none;position:relative;padding-left:22px}
  .log::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
  .log li{position:relative;padding:4px 0 14px}
  .log li::before{content:"";position:absolute;left:-21px;top:10px;width:12px;height:12px;border-radius:50%;
    background:var(--c);box-shadow:0 0 0 3px #e2f7f4}
  .log .d{display:inline-block;font-size:13px;font-weight:700;color:#0e7a6e;margin-bottom:2px}
  .log p{font-size:15px}

  footer{margin-top:28px;text-align:center;font-size:12.5px;color:var(--muted)}

  @media (max-width:600px){
    .page{padding:20px 14px 40px}
    .hero{padding:30px 22px;border-radius:20px}
    .hero h1{font-size:28px}
    .topic{grid-template-columns:1fr}
    .card{padding:16px 18px}
    h2{font-size:18px}
  }
  @media print{
    body{background:#fff}
    .page{padding:0}
    .hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>
<div class="page">

  <header class="hero">
    <span class="tag">ARTICLE PROJECT NOTE</span>
    <h1>기사 프로젝트 노트</h1>
    <p><span class="label">프로젝트 한 줄</span>확인 후 채움</p>
  </header>

  <section>
    <h2>팀 이름과 역할</h2>
    <div class="card">
      <div class="row"><span class="k">팀 이름</span><em class="tbd">확인 후 채움</em></div>
      <div class="row"><span class="v">박정수</span><em class="tbd pink">역할 확인 후 채움</em></div>
    </div>
  </section>

  <section>
    <h2>주제</h2>
    <div class="topic">
      <div class="card"><b>대주제</b><div class="big">경제</div></div>
      <div class="card"><b>내 앵글</b><em class="tbd pink">내일 정함</em></div>
    </div>
  </section>

  <section>
    <h2>할 일 체크리스트</h2>
    <div class="card">
      <ul class="check">
        <li><input type="checkbox" aria-label="할 일 1"><span>팀 이름과 내 역할 확인하기</span></li>
        <li><input type="checkbox" aria-label="할 일 2"><span>프로젝트 브리프 한 줄 받기</span></li>
        <li><input type="checkbox" aria-label="할 일 3"><span>(비어 있음)</span></li>
        <li><input type="checkbox" aria-label="할 일 4"><span>(비어 있음)</span></li>
        <li><input type="checkbox" aria-label="할 일 5"><span>(비어 있음)</span></li>
      </ul>
    </div>
  </section>

  <section>
    <h2>날짜별 기록</h2>
    <div class="card">
      <ul class="log">
        <li><span class="d">11/18</span><p>GitHub 저장소 만들고 노트 페이지 첫 버전 올림</p></li>
      </ul>
    </div>
  </section>

  <footer>기사 프로젝트 노트</footer>
</div>
</body>
</html>
